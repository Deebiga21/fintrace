version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: fintrace-postgres
    restart: always
    environment:
      POSTGRES_USER: fintrace_admin
      POSTGRES_PASSWORD: fintrace_secure_password_2026
      POSTGRES_DB: fintrace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./rust_backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrace_admin -d fintrace"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml_service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintrace-python-ml
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8001
    ports:
      - "8001:8001"
    volumes:
      - ./backend/app/ml/artifacts:/app/app/ml/artifacts
      - ./backend/app/data:/app/app/data

  rust_backend:
    build:
      context: ./rust_backend
      dockerfile: Dockerfile
    container_name: fintrace-rust-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      ml_service:
        condition: service_started
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgres://fintrace_admin:fintrace_secure_password_2026@db:5432/fintrace
      - ML_SERVICE_URL=http://ml_service:8001/api/v1
      - JWT_SECRET=fintrace-super-secure-investigator-secret-key-2026
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fintrace-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - rust_backend

volumes:
  postgres_data:
