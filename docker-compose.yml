version: '3.8'

services:
  ml_service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintrace-python-ml
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8001
      - DATABASE_URL=sqlite:///./fintrace.db
    expose:
      - "8001"
    volumes:
      - ml_artifacts:/app/app/ml/artifacts

  rust_backend:
    build:
      context: ./rust_backend
      dockerfile: Dockerfile
    container_name: fintrace-rust-backend
    restart: always
    depends_on:
      ml_service:
        condition: service_started
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:///app/data/fintrace.db
      - ML_SERVICE_URL=http://ml_service:8001/api/v1
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - fintrace_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fintrace-frontend
    restart: always
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - rust_backend

volumes:
  fintrace_data:
  ml_artifacts:
